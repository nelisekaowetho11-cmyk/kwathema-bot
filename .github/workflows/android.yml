
name: PRIME NET VPN

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PRIME NET VPN APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "PROJECT FILES VERIFIED"

      - name: Build PRIME NET VPN
        run: |
          gradle --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:assembleDebug

      - name: Prepare APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK WAS NOT CREATED"
            exit 1
          fi

          mkdir -p release
          cp "$APK" "release/PRIME-NET-VPN.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-NET-VPN
          path: release/PRIME-NET-VPN.apk
          if-no-files-found: error
          retention-days: 7
