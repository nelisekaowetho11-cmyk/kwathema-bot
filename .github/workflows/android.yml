
name: PRIME NET VPN Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PRIME NET VPN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Repair and Validate Manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path = Path("app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8-sig")

          content = re.sub(
              r"<\?xml.*?\?>",
              "",
              content,
              flags=re.IGNORECASE | re.DOTALL
          )

          start = content.find("<manifest")
          if start == -1:
              raise SystemExit("ERROR: Manifest root not found")

          content = content[start:].lstrip()
          path.write_text(content, encoding="utf-8")

          ET.parse(path)
          print("MANIFEST OK")
          PY

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PRIME-NET-VPN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-NET-VPN
          path: release/PRIME-NET-VPN.apk
          if-no-files-found: error
          retention-days: 7
