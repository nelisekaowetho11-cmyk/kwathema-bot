
name: PrimeNet VPN Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PrimeNet VPN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean and Validate Android Manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path("app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8-sig")

          content = re.sub(
              r"<\?xml[^?]*\?>",
              "",
              content,
              flags=re.IGNORECASE
          )

          content = content.lstrip()
          manifest.write_text(content, encoding="utf-8")

          ET.parse(manifest)
          print("MANIFEST OK")
          PY

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PrimeNet-VPN.apk

      - name: Upload PrimeNet VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeNet-VPN
          path: release/PrimeNet-VPN.apk
          if-no-files-found: error
          retention-days: 7
